name: Bot CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test
